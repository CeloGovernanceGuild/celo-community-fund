name: Branch flow

# Enforces the promotion path: feature branches -> dev -> main.
# Required as a status check by the repository rulesets on dev and main.

on:
  pull_request:
    branches: [dev, main]
  # Manual runs only. The daily audit reports this check on its own commit (see audit.yml).
  workflow_dispatch:

permissions: {}

jobs:
  branch-flow:
    name: branch-flow
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = "main" ] && [ "$HEAD" != "dev" ]; then
            echo "::error::Pull requests into main must come from dev (got '$HEAD')."
            exit 1
          fi
          if [ "$BASE" = "dev" ] && [ "$HEAD" = "main" ]; then
            echo "::error::Do not merge main into dev through a pull request; dev is the integration branch."
            exit 1
          fi
          echo "OK: $HEAD -> $BASE"
